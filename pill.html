<meta charset="utf-8">
<title>axo-link</title>
<style>
  :root {
    --state-running: #4ade80;
    --state-waiting: #fbbf24;
    --state-error:   #f87171;
    --state-idle:    #64748b;
    --surface-pill:  rgba(18, 18, 22, 0.82);
    --border-pill:   rgba(255, 255, 255, 0.10);
    --text:          #e7e7ea;
    --text-dim:      #8b8b96;
    --radius-pill:   999px;
    --motion-quick:  150ms ease-out;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font: 12px/1.45 system-ui, "Segoe UI", sans-serif;
    color: var(--text); background: transparent;
    overflow: hidden; user-select: none;
  }
  #shell {
    height: 100vh; display: flex; flex-direction: column;
    background: var(--surface-pill);
    border: 1px solid var(--border-pill);
    border-radius: 22px;
    backdrop-filter: blur(18px);
    overflow: hidden;
  }
  body.collapsed #shell { border-radius: var(--radius-pill); }
  body.collapsed #tabs,
  body.collapsed #roster,
  body.collapsed #compose { display: none; }

  /* ---- pill bar ---- */
  #bar {
    height: 44px; flex: none; display: flex; align-items: center; gap: 8px;
    padding: 0 14px; -webkit-app-region: drag; cursor: pointer;
  }
  #dots { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%; flex: none;
    background: var(--state-idle); transition: background var(--motion-quick);
  }
  .dot.running { background: var(--state-running); }
  .dot.waiting { background: var(--state-waiting); animation: pulse 1.2s ease-in-out infinite; }
  .dot.error   { background: var(--state-error); }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: .45; transform: scale(.8); }
  }
  #count { color: var(--text-dim); font-size: 11px; white-space: nowrap; }
  #count b { color: var(--state-waiting); font-weight: 600; }
  #add {
    -webkit-app-region: no-drag; flex: none; width: 22px; height: 22px;
    border-radius: 50%; border: 1px solid var(--border-pill); background: transparent;
    color: var(--text-dim); font-size: 14px; line-height: 1; cursor: pointer;
    transition: color var(--motion-quick), border-color var(--motion-quick);
  }
  #add:hover { color: var(--text); border-color: var(--text-dim); }

  /* ---- tabs ---- */
  #tabs { flex: none; display: flex; gap: 4px; padding: 0 10px 6px; -webkit-app-region: no-drag; }
  .tab {
    border: 0; background: transparent; color: var(--text-dim);
    font: inherit; font-size: 11px; padding: 4px 9px; border-radius: 7px;
    cursor: pointer; transition: color var(--motion-quick), background var(--motion-quick);
  }
  .tab:hover { color: var(--text); }
  .tab.on { background: rgba(255, 255, 255, .08); color: var(--text); }
  .tab .n { opacity: .7; }
  .tab.on .n, .tab.alert .n { color: var(--state-waiting); opacity: 1; }

  /* ---- roster ---- */
  #roster { flex: 1; overflow-y: auto; padding: 0 6px 4px; -webkit-app-region: no-drag; }
  .row { padding: 8px 10px; border-radius: 10px; cursor: pointer; transition: background var(--motion-quick); }
  .row:hover { background: rgba(255, 255, 255, .04); }
  .row.sel   { background: rgba(255, 255, 255, .07); }
  .head { display: flex; align-items: center; gap: 8px; }
  .head .label {
    font-weight: 600; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .kind {
    color: var(--text-dim); font-size: 10px; text-transform: uppercase;
    letter-spacing: .06em; white-space: nowrap;
  }
  .kind.approval { color: var(--state-waiting); }
  .body { padding-left: 16px; }
  .summary {
    color: var(--text); font-size: 11px; margin-top: 3px;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .did { color: var(--text-dim); font-size: 10.5px; margin-top: 3px; }
  .pending {
    margin-top: 5px; padding: 5px 8px; border-radius: 7px;
    background: rgba(251, 191, 36, .10); border: 1px solid rgba(251, 191, 36, .22);
    color: #f5d78e; font-family: ui-monospace, Consolas, monospace;
    font-size: 10.5px; word-break: break-all;
  }
  .acts { display: flex; gap: 6px; margin-top: 6px; }
  .acts button {
    font: inherit; font-size: 11px; padding: 4px 12px; border-radius: 7px;
    cursor: pointer; border: 1px solid var(--border-pill);
    background: transparent; color: var(--text-dim);
    transition: color var(--motion-quick), border-color var(--motion-quick);
  }
  .acts .ok:hover { color: var(--state-running); border-color: var(--state-running); }
  .acts .no:hover { color: var(--state-error);   border-color: var(--state-error); }
  #empty { color: var(--text-dim); text-align: center; padding: 26px 16px; line-height: 1.7; }

  /* ---- compose ---- */
  #compose { flex: none; padding: 8px; border-top: 1px solid var(--border-pill); -webkit-app-region: no-drag; }
  #compose input {
    width: 100%; padding: 9px 12px; border-radius: 10px;
    border: 1px solid var(--border-pill); background: rgba(0, 0, 0, .30);
    color: var(--text); font: inherit; outline: none;
  }
  #compose input:focus { border-color: var(--text-dim); }
  #compose input:disabled { opacity: .45; }
</style>

<div id="shell">
  <div id="bar">
    <div id="dots"></div>
    <span id="count"></span>
    <button id="add" title="Start an agent in a folder">+</button>
  </div>
  <div id="tabs"></div>
  <div id="roster"></div>
  <div id="compose"><input id="msg" placeholder="Select a session…" disabled></div>
</div>

<script>
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;',
  }[c]));

  let list = [], sel = null, tab = 'all', expanded = false;

  const setExpanded = (v) => {
    expanded = v;
    document.body.classList.toggle('collapsed', !v);
    axo.resize(v);
  };

  $('#bar').onclick = (e) => { if (e.target.id !== 'add') setExpanded(!expanded); };
  $('#add').onclick = async () => {
    const id = await axo.pick();
    if (id) { sel = id; setExpanded(true); }
  };
  $('#msg').onkeydown = (e) => {
    if (e.key !== 'Enter' || !sel || !e.target.value.trim()) return;
    axo.send(sel, e.target.value.trim());
    e.target.value = '';
  };

  const KIND = { approval_request: 'needs approval', question: 'asked you', finished: 'done' };

  function render() {
    const rank = { waiting: 0, running: 1, error: 2, idle: 3 };
    const sorted = [...list].sort((a, b) => (rank[a.state] - rank[b.state]) || (a.since - b.since));
    const waiting = list.filter((s) => s.state === 'waiting');
    const approvals = waiting.filter((s) => s.waiting_kind === 'approval_request').length;

    // past 8 the dots stop being readable, so collapse them into the count
    $('#dots').innerHTML = sorted.length > 8
      ? ''
      : sorted.map((s) => '<i class="dot ' + s.state + '"></i>').join('');
    $('#count').innerHTML = waiting.length ? '<b>' + waiting.length + ' waiting</b>'
      : sorted.length > 8 ? sorted.length + ' agents'
      : list.length ? 'all busy' : '';

    $('#tabs').innerHTML = [
      ['all', 'All', list.length, false],
      ['waiting', 'Waiting', waiting.length, approvals > 0],
    ].map(([k, name, n, alert]) =>
      '<button class="tab ' + (tab === k ? 'on ' : '') + (alert ? 'alert' : '') +
      '" data-tab="' + k + '">' + name + ' <span class="n">' + n + '</span></button>'
    ).join('');

    const shown = tab === 'waiting' ? sorted.filter((s) => s.state === 'waiting') : sorted;
    $('#roster').innerHTML = shown.length ? shown.map((s) => {
      const approval = s.waiting_kind === 'approval_request';
      const kind = s.state === 'waiting' ? (KIND[s.waiting_kind] || 'waiting') : s.state;
      return '<div class="row ' + (s.id === sel ? 'sel' : '') + '" data-id="' + s.id + '">' +
        '<div class="head">' +
          '<i class="dot ' + s.state + '"></i>' +
          '<span class="label">' + esc(s.label) + '</span>' +
          '<span class="kind ' + (approval ? 'approval' : '') + '">' + esc(kind) + '</span>' +
        '</div>' +
        '<div class="body">' +
          (s.summary ? '<div class="summary">' + esc(s.summary) + '</div>' : '') +
          (s.did ? '<div class="did">did: ' + esc(s.did) + '</div>' : '') +
          (approval && s.pending && s.pending.length
            ? '<div class="pending">wants: ' + s.pending.map(esc).join('<br>') + '</div>' : '') +
          (approval
            ? '<div class="acts">' +
                '<button class="ok" data-act="approve" data-id="' + s.id + '">Approve</button>' +
                '<button class="no" data-act="deny" data-id="' + s.id + '">Deny</button>' +
              '</div>' : '') +
        '</div>' +
      '</div>';
    }).join('')
      : '<div id="empty">' + (tab === 'waiting'
          ? 'Nothing waiting on you.'
          : 'No agents yet.<br>Hit + to start one in a folder.') + '</div>';

    for (const t of document.querySelectorAll('.tab')) {
      t.onclick = () => { tab = t.dataset.tab; render(); };
    }
    for (const b of document.querySelectorAll('.acts button')) {
      b.onclick = (e) => { e.stopPropagation(); axo[b.dataset.act](b.dataset.id); };
    }
    for (const row of document.querySelectorAll('.row')) {
      row.onclick = () => { sel = row.dataset.id; render(); $('#msg').focus(); };
    }

    const cur = list.find((s) => s.id === sel);
    $('#msg').disabled = !cur;
    // the "or I can ask it" half: the CLI session stays open, so a follow-up
    // question is just the next turn down the same stdin.
    $('#msg').placeholder = cur ? 'Reply to ' + cur.label + '…' : 'Select a session…';
  }

  axo.onSessions((l) => { list = l; render(); });
  axo.list().then((l) => { list = l; render(); });
  setExpanded(false);
</script>
